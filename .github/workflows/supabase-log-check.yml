name: Supabase Log Check

on:
  workflow_dispatch:
  schedule:
    - cron: "45 */6 * * *"

permissions:
  contents: read

concurrency:
  group: supabase-log-check
  cancel-in-progress: true

jobs:
  logs:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'schedule' && vars.SUPABASE_LOG_MONITOR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: sfuroqxcljlkbthblqva
      SUPABASE_LOG_WINDOW_HOURS: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check monitoring configuration
        run: npm run logs:config

      - name: Check Supabase production logs
        run: npm run logs:check
